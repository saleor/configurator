      - attribute: Material
      - attribute: Season
      - attribute: Collection
      - attribute: Gender
      - attribute: Care Instructions
      - attribute: Style
      - attribute: Fit Type
      - attribute: Pattern
      - attribute: Sustainability
    variantAttributes:
      - attribute: Size
      - attribute: Color

  - name: "Footwear"
    isShippingRequired: true
    productAttributes:
