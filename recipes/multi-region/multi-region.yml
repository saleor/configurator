# Saleor Multi-Region Configuration
# International e-commerce setup with multiple channels, currencies, and localized experiences

shop:
  defaultMailSenderName: "Global Store"
  defaultMailSenderAddress: "support@global-store.com"
  displayGrossPrices: true
  enableAccountConfirmationByEmail: true
  limitQuantityPerCheckout: 50
  trackInventoryByDefault: true
  reserveStockDurationAnonymousUser: 10
  reserveStockDurationAuthenticatedUser: 60
  defaultWeightUnit: KG
  fulfillmentAutoApprove: true

channels:
  - name: "North America"
    currencyCode: USD
    defaultCountry: US
    slug: north-america
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: true
      expireOrdersAfter: 60
      deleteExpiredOrdersAfter: 120
      markAsPaidStrategy: TRANSACTION_FLOW
      defaultTransactionFlowStrategy: CHARGE
      includeDraftOrderInVoucherUsage: false
      automaticallyFulfillNonShippableGiftCard: true

  - name: "Europe"
    currencyCode: EUR
    defaultCountry: DE
    slug: europe
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_HIGH_STOCK
      automaticallyConfirmAllNewOrders: true
      expireOrdersAfter: 60
      markAsPaidStrategy: TRANSACTION_FLOW
      defaultTransactionFlowStrategy: CHARGE

  - name: "United Kingdom"
    currencyCode: GBP
    defaultCountry: GB
    slug: uk
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: true
      markAsPaidStrategy: TRANSACTION_FLOW
      defaultTransactionFlowStrategy: CHARGE

  - name: "Asia Pacific"
    currencyCode: USD
    defaultCountry: JP
    slug: asia-pacific
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: true
      markAsPaidStrategy: TRANSACTION_FLOW
      defaultTransactionFlowStrategy: CHARGE

  - name: "Middle East"
    currencyCode: AED
    defaultCountry: AE
    slug: middle-east
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: false  # Manual review for high-value orders
      markAsPaidStrategy: TRANSACTION_FLOW
      defaultTransactionFlowStrategy: AUTHORIZATION

productAttributes:
  - name: Global Brand
    inputType: PLAIN_TEXT
  - name: Country of Origin
    inputType: DROPDOWN
    values:
      - name: China
      - name: India
      - name: Vietnam
      - name: Bangladesh
      - name: Germany
      - name: Italy
      - name: USA
      - name: Japan
      - name: South Korea
      - name: Turkey
  - name: Material
    inputType: MULTISELECT
    values:
      - name: Cotton
      - name: Polyester
      - name: Wool
      - name: Leather
      - name: Synthetic
  - name: Import Restrictions
    inputType: MULTISELECT
    values:
      - name: None
      - name: EU REACH Compliant
      - name: CPSIA Compliant
      - name: CE Marking Required
      - name: FDA Approved
      - name: Halal Certified
      - name: Kosher Certified
  - name: HS Code
    inputType: PLAIN_TEXT
  - name: Duties & Taxes
    inputType: DROPDOWN
    values:
      - name: Included (DDP)
      - name: Not Included (DDU)
      - name: Prepaid
  - name: Localization Available
    inputType: MULTISELECT
    values:
      - name: English
      - name: Spanish
      - name: French
      - name: German
      - name: Italian
      - name: Japanese
      - name: Chinese (Simplified)
      - name: Arabic
      - name: Portuguese
      - name: Russian
  - name: Regional Availability
    inputType: MULTISELECT
    values:
      - name: North America
      - name: Europe
      - name: United Kingdom
      - name: Asia Pacific
      - name: Middle East
      - name: Latin America
      - name: Africa
  - name: Warranty Type
    inputType: DROPDOWN
    values:
      - name: International Warranty
      - name: Regional Warranty
      - name: Local Warranty Only
      - name: No Warranty
  - name: Power Adapter
    inputType: MULTISELECT
    values:
      - name: Type A (US/Japan)
      - name: Type C (EU)
      - name: Type G (UK)
      - name: Type I (Australia)
      - name: Universal Adapter Included
      - name: Not Applicable
  - name: Packaging Language
    inputType: MULTISELECT
    values:
      - name: English
      - name: Multi-language
      - name: Local Language
  - name: Return Policy
    inputType: DROPDOWN
    values:
      - name: 30 Days International
      - name: 14 Days International
      - name: Local Returns Only
      - name: No International Returns
  - name: Size
    inputType: DROPDOWN
    values:
      - name: XS
      - name: S
      - name: M
      - name: L
      - name: XL
  - name: Color
    inputType: DROPDOWN
    values:
      - name: Black
      - name: White
      - name: Navy
      - name: Red
      - name: Blue

productTypes:
  - name: "International Product"
    isShippingRequired: true
    productAttributes:
      - attribute: Global Brand
      - attribute: Country of Origin
      - attribute: Material
      - attribute: Import Restrictions
      - attribute: HS Code
      - attribute: Duties & Taxes
      - attribute: Localization Available
      - attribute: Regional Availability
      - attribute: Warranty Type
      - attribute: Power Adapter
      - attribute: Packaging Language
      - attribute: Return Policy
    variantAttributes:
      - attribute: Size
      - attribute: Color

contentAttributes:
  - name: Region Name
    inputType: PLAIN_TEXT
  - name: Default Language
    inputType: DROPDOWN
    values:
      - name: English
      - name: Spanish
      - name: French
      - name: German
      - name: Italian
      - name: Japanese
      - name: Chinese
      - name: Arabic
  - name: Currency Symbol Position
    inputType: DROPDOWN
    values:
      - name: Before Amount ($100)
      - name: After Amount (100€)
  - name: Date Format
    inputType: DROPDOWN
    values:
      - name: MM/DD/YYYY
      - name: DD/MM/YYYY
      - name: YYYY-MM-DD
  - name: Tax Display
    inputType: DROPDOWN
    values:
      - name: Include Tax (VAT)
      - name: Exclude Tax
  - name: Phone Format
    inputType: PLAIN_TEXT
  - name: Address Format
    inputType: PLAIN_TEXT
  - name: Business Hours
    inputType: PLAIN_TEXT
  - name: Local Holidays
    inputType: PLAIN_TEXT
  - name: Support Email
    inputType: PLAIN_TEXT
  - name: Support Phone
    inputType: PLAIN_TEXT
  - name: Customs Information
    inputType: RICH_TEXT
  - name: Zone Name
    inputType: PLAIN_TEXT
  - name: Countries Included
    inputType: PLAIN_TEXT
  - name: Shipping Methods
    inputType: MULTISELECT
    values:
      - name: Standard (5-10 days)
      - name: Express (2-3 days)
      - name: Next Day
      - name: Economy (10-20 days)
  - name: Free Shipping Threshold
    inputType: NUMERIC
  - name: Import Duty Handling
    inputType: DROPDOWN
    values:
      - name: Customer Pays
      - name: Merchant Pays
      - name: Calculated at Checkout
  - name: Tracking Available
    inputType: BOOLEAN
  - name: Insurance Available
    inputType: BOOLEAN
  - name: Signature Required
    inputType: BOOLEAN
  - name: Base Currency
    inputType: PLAIN_TEXT
  - name: Target Currency
    inputType: PLAIN_TEXT
  - name: Exchange Rate
    inputType: NUMERIC
  - name: Last Updated
    inputType: DATE_TIME
  - name: Markup Percentage
    inputType: NUMERIC
  - name: Auto Update
    inputType: BOOLEAN

pageTypes:
  - name: "Regional Settings"
    attributes:
