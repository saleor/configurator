# Saleor B2B Wholesale Configuration
# Business-to-business setup with volume pricing, approval workflows, and payment terms

shop:
  defaultMailSenderName: "B2B Sales Team"
  defaultMailSenderAddress: "sales@b2b-wholesale.com"
  displayGrossPrices: false  # B2B typically shows net prices
  enableAccountConfirmationByEmail: true
  limitQuantityPerCheckout: 10000
  trackInventoryByDefault: true
  reserveStockDurationAnonymousUser: 0  # No anonymous B2B orders
  reserveStockDurationAuthenticatedUser: 1440  # 24 hours for quotes
  defaultWeightUnit: KG

channels:
  - name: "Wholesale Portal"
    currencyCode: USD
    defaultCountry: US
    slug: wholesale
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: false  # Manual approval required
      automaticallyFulfillNonShippableGiftCard: false
      expireOrdersAfter: 30  # Quotes valid for 30 days
      deleteExpiredOrdersAfter: 90
      markAsPaidStrategy: TRANSACTION_FLOW
      allowUnpaidOrders: true  # NET payment terms
      includeDraftOrderInVoucherUsage: true
      defaultTransactionFlowStrategy: AUTHORIZATION

  - name: "VIP Partners"
    currencyCode: USD
    defaultCountry: US
    slug: vip-partners
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: true  # Auto-approve VIP orders
      expireOrdersAfter: 60  # Extended quote validity
      markAsPaidStrategy: TRANSACTION_FLOW
      allowUnpaidOrders: true

productAttributes:
  - name: Manufacturer
    inputType: PLAIN_TEXT
  - name: Manufacturer SKU
    inputType: PLAIN_TEXT
  - name: Minimum Order Quantity
    inputType: NUMERIC
  - name: Case Pack Quantity
    inputType: NUMERIC
  - name: Lead Time
    inputType: DROPDOWN
    values:
      - name: In Stock
      - name: 1-3 business days
      - name: 1 week
      - name: 2 weeks
      - name: 3-4 weeks
      - name: 6-8 weeks
      - name: Made to Order
  - name: Volume Pricing Tiers
    inputType: RICH_TEXT
  - name: Payment Terms
    inputType: DROPDOWN
    values:
      - name: Prepaid
      - name: NET 15
      - name: NET 30
      - name: NET 45
      - name: NET 60
      - name: 2/10 NET 30
  - name: Country of Origin
    inputType: DROPDOWN
    values:
      - name: United States
      - name: China
      - name: Germany
      - name: Italy
      - name: India
      - name: Vietnam
      - name: Mexico
  - name: Certifications
    inputType: MULTISELECT
    values:
      - name: ISO 9001
      - name: ISO 14001
      - name: CE Marking
      - name: UL Listed
      - name: RoHS Compliant
      - name: Fair Trade
      - name: Organic
  - name: Warranty
    inputType: DROPDOWN
    values:
      - name: No Warranty
      - name: 30 days
      - name: 90 days
      - name: 1 year
      - name: 2 years
      - name: Lifetime
  - name: Product Specifications
    inputType: RICH_TEXT
  - name: Technical Data Sheet
    inputType: FILE
  - name: Safety Data Sheet
    inputType: FILE
  - name: Bulk Discount Available
    inputType: BOOLEAN
  - name: Sample Available
    inputType: BOOLEAN
  - name: Private Label Available
    inputType: BOOLEAN
  - name: Drop Ship Available
    inputType: BOOLEAN
  - name: Pack Size
    inputType: DROPDOWN
    values:
      - name: Single Unit
      - name: Pack of 6
      - name: Pack of 12
      - name: Pack of 24
      - name: Case (48)
      - name: Pallet
  - name: Grade
    inputType: DROPDOWN
    values:
      - name: Premium
      - name: Standard
      - name: Economy
  - name: Power Requirements
    inputType: DROPDOWN
    values:
      - name: 110V
      - name: 220V
      - name: 380V 3-Phase
      - name: Battery Powered
      - name: Pneumatic
      - name: Hydraulic
  - name: Dimensions (LxWxH)
    inputType: PLAIN_TEXT
  - name: Weight
    inputType: NUMERIC
  - name: Installation Required
    inputType: BOOLEAN
  - name: Training Available
    inputType: BOOLEAN
  - name: Service Contract Available
    inputType: BOOLEAN

productTypes:
  - name: "Wholesale Product"
    isShippingRequired: true
    productAttributes:
      - attribute: Manufacturer
      - attribute: Manufacturer SKU
      - attribute: Minimum Order Quantity
      - attribute: Case Pack Quantity
      - attribute: Lead Time
      - attribute: Volume Pricing Tiers
      - attribute: Payment Terms
      - attribute: Country of Origin
      - attribute: Certifications
      - attribute: Warranty
      - attribute: Product Specifications
      - attribute: Technical Data Sheet
      - attribute: Safety Data Sheet
      - attribute: Bulk Discount Available
      - attribute: Sample Available
      - attribute: Private Label Available
      - attribute: Drop Ship Available
    variantAttributes:
      - attribute: Pack Size
      - attribute: Grade

  - name: "Industrial Equipment"
    isShippingRequired: true
    productAttributes:
      - attribute: Manufacturer
      - attribute: Manufacturer SKU
      - attribute: Minimum Order Quantity
      - attribute: Lead Time
      - attribute: Country of Origin
      - attribute: Certifications
      - attribute: Warranty
