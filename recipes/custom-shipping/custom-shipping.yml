# Saleor Custom Shipping Configuration
# Advanced shipping setup with complex rules, multiple carriers, and specialized delivery options

shop:
  defaultMailSenderName: "Shipping Department"
  defaultMailSenderAddress: "shipping@custom-logistics.com"
  displayGrossPrices: true
  enableAccountConfirmationByEmail: true
  limitQuantityPerCheckout: 100
  trackInventoryByDefault: true
  reserveStockDurationAnonymousUser: 20
  reserveStockDurationAuthenticatedUser: 120
  defaultWeightUnit: KG
  fulfillmentAutoApprove: false  # Manual review for custom shipping

channels:
  - name: "Standard Commerce"
    currencyCode: USD
    defaultCountry: US
    slug: standard
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: true
      markAsPaidStrategy: TRANSACTION_FLOW
      defaultTransactionFlowStrategy: CHARGE

  - name: "Premium Service"
    currencyCode: USD
    defaultCountry: US
    slug: premium
    isActive: true
    settings:
      automaticallyConfirmAllNewOrders: true
      markAsPaidStrategy: TRANSACTION_FLOW

  - name: "Bulk & Freight"
    currencyCode: USD
    defaultCountry: US
    slug: bulk-freight
    isActive: true
    settings:
      allowUnpaidOrders: true  # NET terms for bulk

productAttributes:
  - name: Shipping Class
    inputType: DROPDOWN
    values:
      - name: Standard
      - name: Oversized
      - name: Fragile
      - name: Hazmat
      - name: Perishable
      - name: High Value
  - name: Package Dimensions (LxWxH)
    inputType: PLAIN_TEXT
  - name: Weight
    inputType: NUMERIC
  - name: Dimensional Weight
    inputType: NUMERIC
  - name: Ships From
    inputType: DROPDOWN
    values:
      - name: Main Warehouse
      - name: East Coast DC
      - name: West Coast DC
      - name: Vendor Direct
      - name: Made to Order
  - name: Carrier Restrictions
    inputType: MULTISELECT
    values:
      - name: No FedEx
      - name: No UPS
      - name: No USPS
      - name: Freight Only
      - name: White Glove Required
  - name: Handling Time
    inputType: DROPDOWN
    values:
      - name: Same Day
      - name: 1 Business Day
      - name: 2-3 Business Days
      - name: 3-5 Business Days
      - name: 1-2 Weeks
      - name: Custom Manufacturing
  - name: Free Shipping Eligible
    inputType: BOOLEAN
  - name: Expedited Available
    inputType: BOOLEAN
  - name: Saturday Delivery
    inputType: BOOLEAN
  - name: Sunday Delivery
    inputType: BOOLEAN
  - name: Signature Required
    inputType: DROPDOWN
    values:
      - name: No Signature
      - name: Signature Required
      - name: Adult Signature (21+)
      - name: Direct Signature
  - name: Insurance Options
    inputType: DROPDOWN
    values:
      - name: No Insurance
      - name: Basic Coverage
      - name: Full Value
      - name: Extended Coverage
  - name: Packaging Type
    inputType: DROPDOWN
    values:
      - name: Standard Box
      - name: Envelope
      - name: Tube
      - name: Pallet
      - name: Crate
      - name: Custom Packaging
  - name: Special Instructions
    inputType: PLAIN_TEXT
  - name: Stackable
    inputType: BOOLEAN
  - name: Orientation
    inputType: DROPDOWN
    values:
      - name: This Side Up
      - name: Flat Only
      - name: Any Orientation
  - name: Temperature Control
    inputType: DROPDOWN
    values:
      - name: None Required
      - name: Keep Cool
      - name: Refrigerated
      - name: Frozen
      - name: Climate Controlled
  - name: Freight Class
    inputType: DROPDOWN
    values:
      - name: Class 50
      - name: Class 55
      - name: Class 60
      - name: Class 65
      - name: Class 70
      - name: Class 77.5
      - name: Class 85
      - name: Class 92.5
      - name: Class 100
  - name: Loading Requirements
    inputType: MULTISELECT
    values:
      - name: Liftgate Required
      - name: Forklift Available
      - name: Loading Dock
      - name: Inside Delivery
      - name: Residential Delivery
  - name: Number of Pallets
    inputType: NUMERIC
  - name: NMFC Code
    inputType: PLAIN_TEXT

productTypes:
  - name: "Shippable Product"
    isShippingRequired: true
    productAttributes:
      - attribute: Shipping Class
      - attribute: Package Dimensions (LxWxH)
      - attribute: Weight
      - attribute: Dimensional Weight
      - attribute: Ships From
      - attribute: Carrier Restrictions
      - attribute: Handling Time
      - attribute: Free Shipping Eligible
      - attribute: Expedited Available
      - attribute: Saturday Delivery
      - attribute: Sunday Delivery
      - attribute: Signature Required
      - attribute: Insurance Options
      - attribute: Packaging Type
      - attribute: Special Instructions
      - attribute: Stackable
      - attribute: Orientation
      - attribute: Temperature Control

  - name: "Freight Product"
    isShippingRequired: true
    productAttributes:
      - attribute: Shipping Class
      - attribute: Package Dimensions (LxWxH)
      - attribute: Weight
      - attribute: Freight Class
      - attribute: Loading Requirements
      - attribute: Number of Pallets
      - attribute: NMFC Code

contentAttributes:
