  - name: Tracking URL
    inputType: PLAIN_TEXT
  - name: Label Format
    inputType: DROPDOWN
    values:
      - name: PDF
      - name: PNG
      - name: ZPL
  - name: Insurance Available
    inputType: BOOLEAN
  - name: Max Weight
    inputType: NUMERIC
  - name: Max Dimensions
    inputType: PLAIN_TEXT
  - name: Prohibited Items
    inputType: PLAIN_TEXT
  - name: Service Areas
    inputType: PLAIN_TEXT
  - name: Rule Name
    inputType: PLAIN_TEXT
  - name: Priority
    inputType: NUMERIC
  - name: Conditions
    inputType: RICH_TEXT
  - name: Actions
    inputType: RICH_TEXT
  - name: Rule Type
    inputType: DROPDOWN
    values:
      - name: Discount
      - name: Surcharge
      - name: Method Restriction
      - name: Free Shipping
      - name: Upgrade Service
  - name: Active
    inputType: BOOLEAN
  - name: Start Date
    inputType: DATE
  - name: End Date
    inputType: DATE

pageTypes:
  - name: "Shipping Zone"
    attributes:
      - attribute: Zone Name
      - attribute: Zone Type
      - attribute: Countries
      - attribute: States/Provinces
      - attribute: Zip/Postal Codes
      - attribute: Base Rate
      - attribute: Rate Type
      - attribute: Rate Table
      - attribute: Free Shipping Threshold
      - attribute: Delivery Time
      - attribute: Cutoff Time
      - attribute: Excluded Products
      - attribute: Surcharges

  - name: "Carrier Service"
