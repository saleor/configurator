# Saleor Click & Collect Configuration
# Omnichannel setup with buy online pickup in-store (BOPIS) and curbside pickup

shop:
  defaultMailSenderName: "Store Pickup"
  defaultMailSenderAddress: "pickup@retail-store.com"
  displayGrossPrices: true
  enableAccountConfirmationByEmail: true
  limitQuantityPerCheckout: 20
  trackInventoryByDefault: true
  reserveStockDurationAnonymousUser: 30  # 30 minutes for pickup reservation
  reserveStockDurationAuthenticatedUser: 240  # 4 hours for authenticated users
  defaultWeightUnit: KG
  fulfillmentAutoApprove: true

channels:
  - name: "Online - Store Pickup"
    currencyCode: USD
    defaultCountry: US
    slug: store-pickup
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: true
      automaticallyFulfillNonShippableGiftCard: true
      expireOrdersAfter: 7  # 7 days to pickup
      deleteExpiredOrdersAfter: 30
      markAsPaidStrategy: TRANSACTION_FLOW
      defaultTransactionFlowStrategy: CHARGE
      allowUnpaidOrders: false  # Payment required for pickup

  - name: "Online - Delivery"
    currencyCode: USD
    defaultCountry: US
    slug: delivery
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_HIGH_STOCK
      automaticallyConfirmAllNewOrders: true
      markAsPaidStrategy: TRANSACTION_FLOW
      defaultTransactionFlowStrategy: CHARGE

  - name: "In-Store Only"
    currencyCode: USD
    defaultCountry: US
    slug: in-store
    isActive: true
    settings:
      automaticallyConfirmAllNewOrders: true
      markAsPaidStrategy: PAYMENT_FLOW

productAttributes:
  - name: Brand
    inputType: PLAIN_TEXT
  - name: Product Category
    inputType: DROPDOWN
    values:
      - name: Electronics
      - name: Apparel
      - name: Home Goods
      - name: Sports & Recreation
      - name: Books & Media
      - name: Toys & Games
      - name: Health & Beauty
      - name: Food & Beverage
  - name: Store Availability
    inputType: MULTISELECT
    values:
      - name: Downtown Store
      - name: Mall Location
      - name: Airport Store
      - name: Suburban Store
      - name: Outlet Center
      - name: Online Only
  - name: Pickup Options
    inputType: MULTISELECT
    values:
      - name: In-Store Pickup
      - name: Curbside Available
      - name: Locker Pickup
      - name: Express Counter
      - name: Drive-Through
  - name: Preparation Time
    inputType: DROPDOWN
    values:
      - name: Ready Now (In Stock)
      - name: 15 minutes
      - name: 30 minutes
      - name: 1 hour
      - name: 2 hours
      - name: 4 hours
      - name: Same Day
      - name: Next Day
  - name: Store Display Location
    inputType: PLAIN_TEXT
  - name: Fragile Item
    inputType: BOOLEAN
  - name: Temperature Controlled
    inputType: DROPDOWN
    values:
      - name: Not Required
      - name: Refrigerated
      - name: Frozen
      - name: Room Temperature
  - name: Age Restricted
    inputType: DROPDOWN
    values:
      - name: None
      - name: 18+
      - name: 21+
  - name: ID Verification Required
    inputType: BOOLEAN
  - name: Assembly Required
    inputType: BOOLEAN
  - name: Installation Service Available
    inputType: BOOLEAN
  - name: Try Before Buy
    inputType: BOOLEAN
  - name: Gift Wrapping Available
    inputType: BOOLEAN
  - name: Express Pickup Eligible
    inputType: BOOLEAN
  - name: Size
    inputType: DROPDOWN
    values:
      - name: Small
      - name: Medium
      - name: Large
      - name: X-Large
  - name: Color
    inputType: DROPDOWN
    values:
      - name: Black
      - name: White
      - name: Blue
      - name: Red
      - name: Green
  - name: Product Type
    inputType: DROPDOWN
    values:
      - name: Fresh Produce
      - name: Dairy
      - name: Meat & Seafood
      - name: Bakery
      - name: Frozen
      - name: Pantry
      - name: Beverages
  - name: Organic
    inputType: BOOLEAN
  - name: Local Product
    inputType: BOOLEAN
  - name: Expiration Handling
    inputType: DROPDOWN
    values:
      - name: Same Day
      - name: 3+ Days
      - name: 1 Week+
      - name: Non-Perishable
  - name: Substitution Allowed
    inputType: BOOLEAN

productTypes:
  - name: "Retail Product"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Product Category
      - attribute: Store Availability
      - attribute: Pickup Options
      - attribute: Preparation Time
      - attribute: Store Display Location
      - attribute: Fragile Item
      - attribute: Temperature Controlled
      - attribute: Age Restricted
      - attribute: ID Verification Required
      - attribute: Assembly Required
      - attribute: Installation Service Available
      - attribute: Try Before Buy
      - attribute: Gift Wrapping Available
      - attribute: Express Pickup Eligible
    variantAttributes:
      - attribute: Size
      - attribute: Color

  - name: "Grocery Product"
    isShippingRequired: false  # Pickup only
    productAttributes:
      - attribute: Product Category
      - attribute: Store Availability
      - attribute: Temperature Controlled
      - attribute: Age Restricted
      - attribute: Product Type
      - attribute: Organic
      - attribute: Local Product
      - attribute: Expiration Handling
      - attribute: Substitution Allowed

