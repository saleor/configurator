# Saleor Marketplace Configuration
# Multi-vendor marketplace with commission tracking and vendor management

shop:
  defaultMailSenderName: "Marketplace Platform"
  defaultMailSenderAddress: "marketplace@example.com"
  displayGrossPrices: true
  enableAccountConfirmationByEmail: true
  limitQuantityPerCheckout: 100
  trackInventoryByDefault: true
  reserveStockDurationAnonymousUser: 60
  reserveStockDurationAuthenticatedUser: 120
  defaultWeightUnit: KG

channels:
  - name: "Global Marketplace"
    currencyCode: USD
    defaultCountry: US
    slug: marketplace
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_SORTING_ORDER
      automaticallyConfirmAllNewOrders: false
      automaticallyFulfillNonShippableGiftCard: true
      expireOrdersAfter: 30
      deleteExpiredOrdersAfter: 90
      markAsPaidStrategy: TRANSACTION_FLOW
      allowUnpaidOrders: false
      includeDraftOrderInVoucherUsage: false
      defaultTransactionFlowStrategy: AUTHORIZATION

productAttributes:
  - name: Vendor Name
    inputType: PLAIN_TEXT
  - name: Vendor ID
    inputType: PLAIN_TEXT
  - name: Commission Rate
    inputType: NUMERIC
  - name: Fulfillment Type
    inputType: DROPDOWN
    values:
      - name: Vendor Fulfilled
      - name: Platform Fulfilled
      - name: Dropship
  - name: Return Policy
    inputType: DROPDOWN
    values:
      - name: 14 days
      - name: 30 days
      - name: 60 days
      - name: No returns
  - name: Shipping Time
    inputType: DROPDOWN
    values:
      - name: 1-2 business days
      - name: 3-5 business days
      - name: 1-2 weeks
  - name: Product Condition
    inputType: DROPDOWN
    values:
      - name: New
      - name: Refurbished
      - name: Used - Like New
      - name: Used - Good
  - name: Vendor SKU
    inputType: PLAIN_TEXT
  - name: Variant Option
    inputType: DROPDOWN
    values:
      - name: Default
  - name: License Type
    inputType: DROPDOWN
    values:
      - name: Single User
      - name: Team (up to 5)
      - name: Business (unlimited)
  - name: Delivery Method
    inputType: DROPDOWN
    values:
      - name: Instant Download
      - name: Email Delivery
      - name: Account Access

productTypes:
  - name: "Marketplace Product"
    isShippingRequired: true
    productAttributes:
      - attribute: Vendor Name
      - attribute: Vendor ID
      - attribute: Commission Rate
      - attribute: Fulfillment Type
      - attribute: Return Policy
      - attribute: Shipping Time
      - attribute: Product Condition
      - attribute: Vendor SKU
    variantAttributes:
      - attribute: Variant Option

  - name: "Digital Product"
    isShippingRequired: false
    productAttributes:
      - attribute: Vendor Name
      - attribute: Vendor ID
      - attribute: Commission Rate
      - attribute: License Type
      - attribute: Delivery Method

contentAttributes:
  - name: Company Name
    inputType: PLAIN_TEXT
  - name: Business Registration Number
    inputType: PLAIN_TEXT
  - name: Vendor Rating
    inputType: NUMERIC
  - name: Total Sales
    inputType: NUMERIC
  - name: Member Since
    inputType: DATE
  - name: Vendor Logo
    inputType: FILE
  - name: Business Category
    inputType: DROPDOWN
    values:
      - name: Electronics
      - name: Fashion
      - name: Home & Garden
      - name: Sports & Outdoors
      - name: Books & Media
  - name: Vendor Description
    inputType: RICH_TEXT
  - name: Return Address
    inputType: PLAIN_TEXT
  - name: Support Email
    inputType: PLAIN_TEXT
  - name: Support Phone
    inputType: PLAIN_TEXT
  - name: Banking Details
    inputType: PLAIN_TEXT
  - name: Tax ID
    inputType: PLAIN_TEXT
  - name: Vendor Status
    inputType: DROPDOWN
    values:
      - name: Active
      - name: Suspended
      - name: Under Review
      - name: Inactive
  - name: Agreement Date
    inputType: DATE
  - name: Agreement Type
    inputType: DROPDOWN
    values:
      - name: Standard
      - name: Premium
      - name: Enterprise
  - name: Commission Structure
    inputType: RICH_TEXT
  - name: Payment Terms
    inputType: DROPDOWN
    values:
      - name: Weekly
      - name: Bi-weekly
      - name: Monthly
  - name: Agreement Document
    inputType: FILE

pageTypes:
  - name: "Vendor Profile"
    attributes:
      - attribute: Company Name
      - attribute: Business Registration Number
      - attribute: Vendor Rating
      - attribute: Total Sales
      - attribute: Member Since
      - attribute: Vendor Logo
      - attribute: Business Category
      - attribute: Vendor Description
      - attribute: Return Address
      - attribute: Support Email
      - attribute: Support Phone
      - attribute: Banking Details
      - attribute: Tax ID
      - attribute: Vendor Status

  - name: "Vendor Agreement"
    attributes:
      - attribute: Agreement Date
      - attribute: Agreement Type
      - attribute: Commission Structure
      - attribute: Payment Terms
      - attribute: Agreement Document

