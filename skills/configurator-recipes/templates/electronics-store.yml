# Electronics Store Configuration Template
# A complete Saleor configuration for electronics and tech retail
#
# Customize this template for your specific needs:
# - Update channel settings for your market
# - Modify product types for your catalog
# - Adjust attributes for your specific products
# - Add your actual products and variants

# =============================================================================
# CHANNELS
# =============================================================================
channels:
  - name: "Electronics Store"
    slug: "electronics-store"
    currencyCode: USD
    defaultCountry: US
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_HIGH_STOCK

# =============================================================================
# PRODUCT ATTRIBUTES
# =============================================================================
# Defined once and referenced by name from product types
productAttributes:
  - name: Brand
    inputType: DROPDOWN
    values:
      - name: Apple
      - name: Samsung
      - name: Google
      - name: OnePlus
      - name: Dell
      - name: HP
      - name: Lenovo
      - name: ASUS
  - name: Screen Size
    inputType: PLAIN_TEXT
  - name: Display Type
    inputType: DROPDOWN
    values:
      - name: OLED
      - name: AMOLED
      - name: LCD
  - name: Warranty
    inputType: DROPDOWN
    values:
      - name: 1 Year
      - name: 2 Years
  - name: Storage
    inputType: DROPDOWN
    values:
      - name: 64GB
      - name: 128GB
      - name: 256GB
      - name: 512GB
      - name: 1TB
      - name: 256GB SSD
      - name: 512GB SSD
      - name: 1TB SSD
      - name: 2TB SSD
  - name: Color
    inputType: SWATCH
    values:
      - name: Black
      - name: White
      - name: Blue
      - name: Gold
      - name: Silver
      - name: Space Gray
  - name: Processor
    inputType: DROPDOWN
    values:
      - name: Intel Core i5
      - name: Intel Core i7
      - name: Intel Core i9
      - name: Apple M1
      - name: Apple M2
      - name: Apple M3
      - name: AMD Ryzen 5
      - name: AMD Ryzen 7
  - name: RAM
    inputType: DROPDOWN
    values:
      - name: 8GB
      - name: 16GB
      - name: 32GB
      - name: 64GB
  - name: Connectivity
    inputType: DROPDOWN
    values:
      - name: WiFi Only
      - name: WiFi + Cellular
  - name: Compatibility
    inputType: MULTISELECT
    values:
      - name: iPhone
      - name: Android
      - name: iPad
      - name: MacBook
      - name: Windows PC
  - name: Publisher
    inputType: PLAIN_TEXT
  - name: Platform
    inputType: MULTISELECT
    values:
      - name: Windows
      - name: macOS
      - name: Linux
      - name: iOS
      - name: Android
  - name: License Type
    inputType: DROPDOWN
    values:
      - name: Single User
      - name: Family (5 users)
      - name: Business
      - name: Enterprise

# =============================================================================
# PRODUCT TYPES
# =============================================================================
productTypes:
  # Smartphone with storage and color variants
  - name: "Smartphone"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Screen Size
      - attribute: Display Type
      - attribute: Warranty
    variantAttributes:
      - attribute: Storage
      - attribute: Color

  # Laptop with RAM, storage, and color variants
  - name: "Laptop"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Processor
      - attribute: Screen Size
      - attribute: Warranty
    variantAttributes:
      - attribute: RAM
      - attribute: Storage
      - attribute: Color

  # Tablet with storage and color variants
  - name: "Tablet"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Screen Size
      - attribute: Warranty
    variantAttributes:
      - attribute: Storage
      - attribute: Connectivity
      - attribute: Color

  # Tech Accessory
  - name: "Tech Accessory"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Compatibility
    variantAttributes:
      - attribute: Color

  # Software/Digital Product
  - name: "Software"
    isShippingRequired: false
    productAttributes:
      - attribute: Publisher
      - attribute: Platform
    variantAttributes:
      - attribute: License Type

# =============================================================================
# CATEGORIES
# =============================================================================
categories:
  - name: "Electronics"
    slug: "electronics"
    subcategories:
      - name: "Phones"
        slug: "phones"
        subcategories:
          - name: "Smartphones"
            slug: "smartphones"
          - name: "Phone Cases"
            slug: "phone-cases"
          - name: "Phone Accessories"
            slug: "phone-accessories"
      - name: "Computers"
        slug: "computers"
        subcategories:
          - name: "Laptops"
            slug: "laptops"
          - name: "Desktops"
            slug: "desktops"
          - name: "Computer Accessories"
            slug: "computer-accessories"
      - name: "Tablets"
        slug: "tablets"
      - name: "Audio"
        slug: "audio"
        subcategories:
          - name: "Headphones"
            slug: "headphones"
          - name: "Speakers"
            slug: "speakers"
          - name: "Earbuds"
            slug: "earbuds"
      - name: "Wearables"
        slug: "wearables"
      - name: "Software"
        slug: "software"
        subcategories:
          - name: "Productivity"
            slug: "productivity-software"
          - name: "Security"
            slug: "security-software"
          - name: "Creative"
            slug: "creative-software"

# =============================================================================
# COLLECTIONS
# =============================================================================
collections:
  - name: "New Arrivals"
    slug: "new-arrivals"
    description: "Latest tech just released"
    channelListings:
      - channelSlug: "electronics-store"
        isPublished: true

  - name: "Best Sellers"
    slug: "best-sellers"
    description: "Our most popular products"
    channelListings:
      - channelSlug: "electronics-store"
        isPublished: true

  - name: "Deals & Offers"
    slug: "deals"
    description: "Special prices on select items"
    channelListings:
      - channelSlug: "electronics-store"
        isPublished: true

  - name: "Work From Home"
    slug: "work-from-home"
    description: "Essential tech for remote work"
    channelListings:
      - channelSlug: "electronics-store"
        isPublished: true

# =============================================================================
# WAREHOUSES
# =============================================================================
warehouses:
  - name: "Tech Distribution Center"
    slug: "tech-dc"
    email: "fulfillment@example.com"
    address:
      streetAddress1: "456 Tech Park Drive"
      city: "Austin"
      postalCode: "78701"
      country: US
      countryArea: "TX"

# =============================================================================
# SHIPPING ZONES
# =============================================================================
shippingZones:
  - name: "US Shipping"
    countries:
      - US
    warehouses:
      - "tech-dc"
    shippingMethods:
      - name: "Standard Shipping"
        type: PRICE
        channelListings:
          - channel: "electronics-store"
            price: 7.99
            minimumOrderPrice: 0
            maximumOrderPrice: 99.99
      - name: "Free Shipping"
        type: PRICE
        channelListings:
          - channel: "electronics-store"
            price: 0
            minimumOrderPrice: 100
      - name: "Express (2-Day)"
        type: PRICE
        channelListings:
          - channel: "electronics-store"
            price: 19.99
      - name: "Next Day"
        type: PRICE
        channelListings:
          - channel: "electronics-store"
            price: 34.99

# =============================================================================
# TAX CLASSES
# =============================================================================
taxClasses:
  - name: "Electronics"
    countryRates:
      - countryCode: US
        rate: 0

  - name: "Digital Products"
    countryRates:
      - countryCode: US
        rate: 0

# =============================================================================
# EXAMPLE PRODUCT
# =============================================================================
products:
  - name: "Pro Laptop 15"
    slug: "pro-laptop-15"
    productType: "Laptop"
    category: "electronics/computers/laptops"
    description: |
      Powerful laptop for professionals. Features the latest processor,
      stunning display, and all-day battery life.
    channelListings:
      - channel: "electronics-store"
        isPublished: true
        isAvailableForPurchase: true
        visibleInListings: true
    variants:
      - name: "16GB / 512GB SSD / Space Gray"
        sku: "LAPTOP-15-16GB-512"
        attributes:
          RAM: "16GB"
          Storage: "512GB SSD"
          Color: "Space Gray"
        channelListings:
          - channel: "electronics-store"
            price: 1299.99
      - name: "32GB / 1TB SSD / Silver"
        sku: "LAPTOP-15-32GB-1TB"
        attributes:
          RAM: "32GB"
          Storage: "1TB SSD"
          Color: "Silver"
        channelListings:
          - channel: "electronics-store"
            price: 1799.99
