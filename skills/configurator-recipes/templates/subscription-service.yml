# Subscription Service Configuration Template
# A complete Saleor configuration for subscription-based products and SaaS
#
# Customize this template for your specific needs:
# - Update plan tiers and pricing
# - Modify features for your service
# - Adjust billing cycles
# - Add your actual subscription products

# =============================================================================
# CHANNELS
# =============================================================================
channels:
  - name: "Subscription Portal"
    slug: "subscription-portal"
    currencyCode: USD
    defaultCountry: US
    isActive: true

# =============================================================================
# PRODUCT ATTRIBUTES
# =============================================================================
# Defined once and referenced by name from product types
productAttributes:
  - name: Plan Description
    inputType: RICH_TEXT
  - name: Features Included
    inputType: MULTISELECT
    values:
      - name: Basic Support
      - name: Priority Support
      - name: 24/7 Support
      - name: API Access
      - name: Advanced Analytics
      - name: Custom Branding
      - name: SSO Integration
      - name: Dedicated Account Manager
  - name: Plan Tier
    inputType: DROPDOWN
    values:
      - name: Basic
      - name: Professional
      - name: Enterprise
  - name: User Limit
    inputType: DROPDOWN
    values:
      - name: 1 User
      - name: 5 Users
      - name: 10 Users
      - name: 25 Users
      - name: Unlimited
  - name: Annual Discount
    inputType: PLAIN_TEXT
  - name: Product Description
    inputType: RICH_TEXT
  - name: Validity
    inputType: DROPDOWN
    values:
      - name: Lifetime
      - name: 1 Year
      - name: Never Expires
  - name: Add-On Description
    inputType: RICH_TEXT
  - name: Requirements
    inputType: PLAIN_TEXT
  - name: Billing Cycle
    inputType: DROPDOWN
    values:
      - name: Monthly
      - name: Annual
      - name: One-Time

# =============================================================================
# PRODUCT TYPES
# =============================================================================
productTypes:
  # Monthly Subscription
  - name: "Monthly Subscription"
    isShippingRequired: false
    productAttributes:
      - attribute: Plan Description
      - attribute: Features Included
    variantAttributes:
      - attribute: Plan Tier
      - attribute: User Limit

  # Annual Subscription (discounted)
  - name: "Annual Subscription"
    isShippingRequired: false
    productAttributes:
      - attribute: Plan Description
      - attribute: Features Included
      - attribute: Annual Discount
    variantAttributes:
      - attribute: Plan Tier
      - attribute: User Limit

  # One-Time Purchase (lifetime access, credits, etc.)
  - name: "One-Time Purchase"
    isShippingRequired: false
    productAttributes:
      - attribute: Product Description
      - attribute: Validity

  # Add-On Service
  - name: "Add-On Service"
    isShippingRequired: false
    productAttributes:
      - attribute: Add-On Description
      - attribute: Requirements
    variantAttributes:
      - attribute: Billing Cycle

# =============================================================================
# CATEGORIES
# =============================================================================
categories:
  - name: "Subscriptions"
    slug: "subscriptions"
    subcategories:
      - name: "Plans"
        slug: "plans"
        subcategories:
          - name: "Basic Plans"
            slug: "basic-plans"
          - name: "Professional Plans"
            slug: "professional-plans"
          - name: "Enterprise Plans"
            slug: "enterprise-plans"

  - name: "Add-Ons"
    slug: "add-ons"
    subcategories:
      - name: "Storage"
        slug: "storage-add-ons"
      - name: "Support"
        slug: "support-add-ons"
      - name: "Features"
        slug: "feature-add-ons"

  - name: "One-Time Purchases"
    slug: "one-time"
    subcategories:
      - name: "Credits"
        slug: "credits"
      - name: "Training"
        slug: "training"

# =============================================================================
# COLLECTIONS
# =============================================================================
collections:
  - name: "Most Popular"
    slug: "most-popular"
    description: "Our most chosen plans"
    channelListings:
      - channelSlug: "subscription-portal"
        isPublished: true

  - name: "Best Value"
    slug: "best-value"
    description: "Annual plans with maximum savings"
    channelListings:
      - channelSlug: "subscription-portal"
        isPublished: true

  - name: "Enterprise Solutions"
    slug: "enterprise-solutions"
    description: "Custom solutions for large organizations"
    channelListings:
      - channelSlug: "subscription-portal"
        isPublished: true

# =============================================================================
# TAX CLASSES
# =============================================================================
taxClasses:
  - name: "Digital Services"
    countryRates:
      - countryCode: US
        rate: 0
      - countryCode: GB
        rate: 20
      - countryCode: DE
        rate: 19

# =============================================================================
# EXAMPLE PRODUCTS
# =============================================================================
