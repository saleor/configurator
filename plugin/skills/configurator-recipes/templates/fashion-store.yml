# Fashion Store Configuration Template
# A complete Saleor configuration for apparel and fashion retail
#
# Customize this template for your specific needs:
# - Update channel names and currencies for your markets
# - Modify categories to match your product catalog
# - Adjust attributes for your specific products
# - Add your actual products and variants

# =============================================================================
# CHANNELS
# =============================================================================
# Sales channels for different markets/regions
channels:
  - name: "US Store"
    slug: "us-store"
    currencyCode: USD
    defaultCountry: US
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_HIGH_STOCK

  - name: "EU Store"
    slug: "eu-store"
    currencyCode: EUR
    defaultCountry: DE
    isActive: true
    settings:
      allocationStrategy: PRIORITIZE_HIGH_STOCK

# =============================================================================
# PRODUCT ATTRIBUTES
# =============================================================================
# Defined once and referenced by name from product types
productAttributes:
  - name: Brand
    inputType: DROPDOWN
    values:
      - name: House Brand
      - name: Premium Collection
  - name: Material
    inputType: DROPDOWN
    values:
      - name: 100% Cotton
      - name: Cotton Blend
      - name: Organic Cotton
      - name: Denim
      - name: Cotton
      - name: Chino
      - name: Linen
      - name: Leather
      - name: Synthetic
      - name: Canvas
      - name: Suede
  - name: Care Instructions
    inputType: RICH_TEXT
  - name: Size
    inputType: DROPDOWN
    values:
      - name: XS
      - name: S
      - name: M
      - name: L
      - name: XL
      - name: XXL
      - name: "6"
      - name: "7"
      - name: "8"
      - name: "9"
      - name: "10"
      - name: "11"
      - name: "12"
  - name: Color
    inputType: SWATCH
    values:
      - name: Black
      - name: White
      - name: Navy
      - name: Gray
      - name: Red
  - name: Fit
    inputType: DROPDOWN
    values:
      - name: Slim
      - name: Regular
      - name: Relaxed
  - name: Waist
    inputType: DROPDOWN
    values:
      - name: "28"
      - name: "30"
      - name: "32"
      - name: "34"
      - name: "36"
      - name: "38"
  - name: Length
    inputType: DROPDOWN
    values:
      - name: "30"
      - name: "32"
      - name: "34"
  - name: Style
    inputType: DROPDOWN
    values:
      - name: Casual
      - name: Formal
      - name: Party
      - name: Summer

# =============================================================================
# PRODUCT TYPES
# =============================================================================
# Define the structure for different product categories
productTypes:
  # T-Shirt with size and color variants
  - name: "T-Shirt"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Material
      - attribute: Care Instructions
    variantAttributes:
      - attribute: Size
      - attribute: Color

  # Pants with waist, length, and color variants
  - name: "Pants"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Material
      - attribute: Fit
    variantAttributes:
      - attribute: Waist
      - attribute: Length
      - attribute: Color

  # Dress with size and color variants
  - name: "Dress"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Material
      - attribute: Style
    variantAttributes:
      - attribute: Size
      - attribute: Color

  # Shoes with size and color variants
  - name: "Shoes"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Material
    variantAttributes:
      - attribute: Size
      - attribute: Color

  # Accessories (bags, jewelry, etc.)
  - name: "Accessory"
    isShippingRequired: true
    productAttributes:
      - attribute: Brand
      - attribute: Material
    variantAttributes:
      - attribute: Color

# =============================================================================
# CATEGORIES
# =============================================================================
# Hierarchical product organization
categories:
  - name: "Clothing"
    slug: "clothing"
    subcategories:
      - name: "Men's"
        slug: "mens"
        subcategories:
          - name: "T-Shirts"
            slug: "mens-t-shirts"
          - name: "Pants"
            slug: "mens-pants"
          - name: "Shoes"
            slug: "mens-shoes"
      - name: "Women's"
        slug: "womens"
        subcategories:
          - name: "Dresses"
            slug: "womens-dresses"
          - name: "Tops"
            slug: "womens-tops"
          - name: "Pants"
            slug: "womens-pants"
          - name: "Shoes"
            slug: "womens-shoes"

  - name: "Accessories"
    slug: "accessories"
    subcategories:
      - name: "Bags"
        slug: "bags"
      - name: "Jewelry"
        slug: "jewelry"
      - name: "Belts"
        slug: "belts"

# =============================================================================
# COLLECTIONS
# =============================================================================
# Curated product groupings
collections:
  - name: "New Arrivals"
    slug: "new-arrivals"
    description: "Just landed - our newest styles"
    channelListings:
      - channelSlug: "us-store"
        isPublished: true
      - channelSlug: "eu-store"
        isPublished: true

  - name: "Best Sellers"
    slug: "best-sellers"
    description: "Our most popular items"
    channelListings:
      - channelSlug: "us-store"
        isPublished: true
      - channelSlug: "eu-store"
        isPublished: true

  - name: "Sale"
    slug: "sale"
    description: "Special offers and discounts"
    channelListings:
      - channelSlug: "us-store"
        isPublished: true
      - channelSlug: "eu-store"
        isPublished: true

  - name: "Summer Collection"
    slug: "summer-collection"
    description: "Light and breezy styles for warm weather"
    channelListings:
      - channelSlug: "us-store"
        isPublished: true
      - channelSlug: "eu-store"
        isPublished: true

# =============================================================================
# WAREHOUSES
# =============================================================================
warehouses:
  - name: "Main Warehouse"
    slug: "main-warehouse"
    email: "warehouse@example.com"
    address:
      streetAddress1: "123 Warehouse Street"
      city: "Newark"
      postalCode: "07101"
      country: US
      countryArea: "NJ"

# =============================================================================
# SHIPPING ZONES
# =============================================================================
shippingZones:
  - name: "US Domestic"
    countries:
      - US
    warehouses:
      - "main-warehouse"
    shippingMethods:
      - name: "Standard Shipping"
        type: PRICE
        channelListings:
          - channel: "us-store"
            price: 5.99
            minimumOrderPrice: 0
            maximumOrderPrice: 49.99
      - name: "Free Shipping"
        type: PRICE
        channelListings:
          - channel: "us-store"
            price: 0
            minimumOrderPrice: 50
      - name: "Express Shipping"
        type: PRICE
        channelListings:
          - channel: "us-store"
            price: 14.99

  - name: "Europe"
    countries:
      - DE
      - FR
      - IT
      - ES
      - GB
    warehouses:
      - "main-warehouse"
    shippingMethods:
      - name: "Standard International"
        type: PRICE
        channelListings:
          - channel: "eu-store"
            price: 9.99
      - name: "Express International"
        type: PRICE
        channelListings:
          - channel: "eu-store"
            price: 24.99

# =============================================================================
# TAX CLASSES
# =============================================================================
taxClasses:
  - name: "Standard Rate"
    countryRates:
      - countryCode: US
        rate: 0
      - countryCode: DE
        rate: 19
      - countryCode: FR
        rate: 20
      - countryCode: GB
        rate: 20

# =============================================================================
# EXAMPLE PRODUCT (customize with your actual products)
# =============================================================================
products:
  - name: "Classic Crew Neck T-Shirt"
    slug: "classic-crew-neck-tshirt"
    productType: "T-Shirt"
    category: "clothing/mens/mens-t-shirts"
    description: |
      Our signature crew neck t-shirt. Made from 100% premium cotton
      for all-day comfort. Pre-shrunk and machine washable.
    channelListings:
      - channel: "us-store"
        isPublished: true
        isAvailableForPurchase: true
        visibleInListings: true
      - channel: "eu-store"
        isPublished: true
        isAvailableForPurchase: true
        visibleInListings: true
    variants:
      - name: "M / Black"
        sku: "CREW-BLK-M"
        attributes:
          Size: "M"
          Color: "Black"
        channelListings:
          - channel: "us-store"
            price: 29.99
          - channel: "eu-store"
            price: 24.99
